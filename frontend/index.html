<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Code Explainer</title>
  <link rel="stylesheet" href="style.css">

  <style>
    #app_section {
      display: none;
    }
  </style>
</head>

<body>
  <h1>Room Access</h1>

  <!-- CREATE ROOM -->
  <button onclick="createRoom()">Create New Room</button>

  <br><br>

  <!-- JOIN ROOM -->
  <input id="join_code" placeholder="Enter room code">
  <button onclick="joinRoom()">Join Room</button>

  <p id="join_status" style="color:red;"></p>

  <hr>

  <p id="current_room" style="font-weight:bold; display:none;"></p>

  <!-- MAIN APP -->
  <div id="app_section">

    <h1>Code Explainer (Gemini + FastAPI)</h1>

    <textarea id="code" rows="5" cols="50" placeholder="Paste your code here"></textarea><br><br>
    <input id="action" placeholder="e.g. explain or optimize"><br><br>
    <button onclick="sendCode()">Send</button>

    <h2>Response:</h2>
    <div id="result" style="white-space: pre-wrap; font-size: 16px;"></div>

    <h2>Version History:</h2>
    <button onclick="loadHistory()">Load History</button>
    <pre id="history"></pre>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <h2>Comments</h2>
    <div id="comments" style="border:1px solid #ccc; padding:10px; min-height:50px;"></div>

    <input id="comment_input" placeholder="Write a comment...">
    <button onclick="sendComment()">Send</button>

  </div>

<script>
  const socket = io("http://127.0.0.1:8000", { transports: ["websocket"] });

  let currentRoom = null;

  /* --------------------------------------------------
        CREATE ROOM  →  gets code from backend
  ---------------------------------------------------*/
  async function createRoom() {
    const res = await fetch("http://127.0.0.1:8000/create-room", {
      method: "POST"
    });

    const data = await res.json();

    document.getElementById("join_code").value = data.room;
    document.getElementById("join_status").style.color = "green";
    document.getElementById("join_status").innerText =
      "Room created! Use code: " + data.room;
  }

  /* --------------------------------------------------
        JOIN ROOM → validate room before joining
  ---------------------------------------------------*/
  async function joinRoom() {
    const room = document.getElementById("join_code").value.trim();

    if (!room) {
      document.getElementById("join_status").innerText = "Enter a room code.";
      return;
    }

    // validate from backend
    const res = await fetch(`http://127.0.0.1:8000/validate-room/${room}`);
    const data = await res.json();

    if (!data.valid) {
      document.getElementById("join_status").innerText =
        "Invalid room code!";
      return;
    }

    document.getElementById("join_status").innerText = "";

    // leave previous room if exists
    if (currentRoom) socket.emit("leave", { room: currentRoom });

    currentRoom = room;

    socket.emit("join", { room });

    document.getElementById("app_section").style.display = "block";
    document.getElementById("current_room").style.display = "block";
    document.getElementById("current_room").innerText =
      "Current Room: " + room;

    document.getElementById("comments").innerHTML = "";
  }

  /* --------------------------------------------------
        SOCKET HANDLERS
  ---------------------------------------------------*/
  socket.on("room_history", (comments) => {
    const box = document.getElementById("comments");
    box.innerHTML = "";
    comments.forEach(c => appendComment(c));
  });

  socket.on("new_comment", (data) => {
    appendComment(data);
  });

  function sendComment() {
    const text = document.getElementById("comment_input").value;
    if (!text.trim()) return;

    socket.emit("comment", {
      room: currentRoom,
      author: "User",
      text: text
    });

    document.getElementById("comment_input").value = "";
  }

  function appendComment(c) {
    const box = document.getElementById("comments");
    box.innerHTML += `<div><b>${c.author}:</b> ${c.text}</div>`;
  }

  /* --------------------------------------------------
        CODE EXPLAINER
  ---------------------------------------------------*/
  async function sendCode() {
    const code = document.getElementById("code").value;
    const action = document.getElementById("action").value;

    const res = await fetch("http://127.0.0.1:8000/process-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, action })
    });

    const data = await res.json();

    document.getElementById("result").innerHTML = `
      <h3> Code </h3>
      <pre>${data.result.code}</pre>

      <h3>📌 What it Does</h3>
      <p>${data.result.what_it_does}</p>

      <h3>🔍 Visual Flow</h3>
      <pre>${data.result.visual_flow}</pre>

      <h3>🪜 Step-by-Step</h3>
      <pre>${data.result.steps}</pre>

      <h3>💡 Key Idea</h3>
      <p>${data.result.key_idea}</p>

      <h3>📤 Output</h3>
      <pre>${data.result.output}</pre>
    `;
  }

  async function loadHistory() {
    const res = await fetch("http://127.0.0.1:8000/history");
    const data = await res.json();

    let output = "";
    data.history.forEach((h, i) => {
      output += `Version ${i + 1}\n`;
      output += `Time: ${h.timestamp}\n`;
      output += `Code:\n${h.code}\n\n`;
      output += `Explanation:\n${h.explanation}\n`;
      output += "-----------------------------\n\n";
    });

    document.getElementById("history").textContent = output;
  }

</script>

</body>
</html>
