<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Collaboration — Google Docs Mode</title>
  <style>
    body { font-family: Inter, Arial; padding: 20px; background:#0e0e0f; color:#fff; display:flex; gap:20px; }
    textarea { width:100%; height:400px; background:#111; color:#eee;
               border:1px solid #333; border-radius:6px; padding:12px; resize:none; }
    .right { width:300px; }
    #comments { height:300px; overflow:auto; background:#111; border:1px solid #333; padding:8px; }
  </style>
</head>
<body>

  <div style="flex:1">
    <h2>Google Docs Collaboration</h2>
    <h3 id="room_label">Room: —</h3>

    <textarea id="editor"></textarea>
    <div style="margin-top:6px; color:#aaa">Status: <span id="sync_status">disconnected</span></div>
  </div>

  <div class="right">
    <h3>Comments</h3>
    <div id="comments"></div>
    <input id="comment_input" placeholder="Write comment...">
    <button onclick="sendComment()">Send</button>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

 <script>
const socket = io("http://127.0.0.1:8000", {
  transports: ["websocket"],
  upgrade: false
});

const room = new URLSearchParams(location.search).get("room");
document.getElementById("room_label").innerText = "Room: " + room;

let applyingPatch = false;
let lastText = "";
let isJoined = false;

const editor = document.getElementById("editor");

// 1️⃣ CONNECTION
socket.on("connect", () => {
  console.log("✅ CONNECTED — Socket ID:", socket.id);
  console.log("🚪 Joining room:", room);
  socket.emit("join", { room });
  document.getElementById("sync_status").innerText = "connecting...";
});

socket.on("disconnect", () => {
  console.log("❌ DISCONNECTED");
  isJoined = false;
  document.getElementById("sync_status").innerText = "disconnected";
});

// 2️⃣ RECEIVE FULL DOCUMENT
socket.on("editor_full", msg => {
  console.log("📥 FULL DOC RECEIVED:", msg.content.length, "chars");
  editor.value = msg.content;
  lastText = msg.content;
  isJoined = true;
  document.getElementById("sync_status").innerText = "connected ✅";
});

// 3️⃣ RECEIVE PATCHES
socket.on("editor_update", patch => {
  console.log("📥 PATCH RECEIVED:", patch);
  
  if (!isJoined) {
    console.warn("⚠️ Received patch before join completed, ignoring");
    return;
  }

  applyingPatch = true;

  let value = editor.value;
  
  console.log("   Before:", JSON.stringify(value));
  console.log("   Applying: start=" + patch.start + ", remove=" + patch.removedLength + ", add=" + JSON.stringify(patch.text));
  
  editor.value =
    value.slice(0, patch.start) +
    patch.text +
    value.slice(patch.start + patch.removedLength);

  console.log("   After:", JSON.stringify(editor.value));
  
  lastText = editor.value;
  applyingPatch = false;
});

// 4️⃣ SEND PATCHES
editor.addEventListener("input", () => {
  if (applyingPatch) {
    console.log("⏭️ Skipping input (applying remote patch)");
    return;
  }
  
  if (!isJoined) {
    console.warn("⚠️ Not joined yet, skipping local change broadcast");
    return;
  }

  const newText = editor.value;
  const oldText = lastText;

  // Find where the text starts to differ (from the beginning)
  let start = 0;
  const minLength = Math.min(oldText.length, newText.length);
  
  while (start < minLength && oldText[start] === newText[start]) {
    start++;
  }

  // Find where the text starts to differ (from the end)
  let endOld = oldText.length;
  let endNew = newText.length;
  
  while (endOld > start && 
         endNew > start && 
         oldText[endOld - 1] === newText[endNew - 1]) {
    endOld--;
    endNew--;
  }

  // Calculate what was removed and what was added
  const removedLength = endOld - start;
  const addedText = newText.slice(start, endNew);

  const patch = {
    room,
    start,
    removedLength: removedLength,
    text: addedText
  };

  console.log("📤 SENDING PATCH:", patch);
  socket.emit("editor_broadcast", patch);

  lastText = newText;
});

// 5️⃣ COMMENTS
socket.on("room_history", docs => {
  const c = document.getElementById("comments");
  c.innerHTML = "";
  docs.forEach(d => appendComment(d));
});

socket.on("new_comment", appendComment);

function appendComment(c) {
  const box = document.getElementById("comments");
  box.innerHTML += `<div><b>${c.author}</b>: ${c.text}</div>`;
  box.scrollTop = box.scrollHeight;
}

function sendComment() {
  const input = document.getElementById("comment_input");
  if (!input.value.trim()) return;
  socket.emit("comment", { room, author: "User", text: input.value });
  input.value = "";
}
</script>
